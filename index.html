<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maple Ridge HOA Portal (Demo)</title>
<style>
:root{--bg:#eef3f0;--card:#fff;--tx:#14221d;--mut:#5b6b64;--bd:#d5dfda;--ac:#1d6b57;--acx:#fff;--ok:#1d7a4d;--wa:#9a6a12;--er:#b33a3a;--soft:#e2eee9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1815;--card:#18241f;--tx:#e6efeb;--mut:#9fb2aa;--bd:#2c3d36;--ac:#4cc0a0;--acx:#07130f;--ok:#58c98a;--wa:#e0b25a;--er:#ee7b7b;--soft:#213129}}
:root[data-theme="dark"]{--bg:#0f1815;--card:#18241f;--tx:#e6efeb;--mut:#9fb2aa;--bd:#2c3d36;--ac:#4cc0a0;--acx:#07130f;--ok:#58c98a;--wa:#e0b25a;--er:#ee7b7b;--soft:#213129}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:16px;flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:none;color:var(--mut);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--soft);color:var(--ac);font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font-size:28px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--ac);font-weight:600}
.tag.wa{color:var(--wa)}.tag.er{color:var(--er)}.tag.ok{color:var(--ok)}
button.p,button.s{font:inherit;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--ac)}
button.p{background:var(--ac);color:var(--acx);font-weight:600}
button.s{background:none;color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}
.item{padding:10px 0;border-top:1px solid var(--bd)}.item:first-of-type{border-top:0}
.steps{display:flex;gap:4px;margin:10px 0}.steps i{flex:1;height:6px;border-radius:3px;background:var(--bd)}.steps i.d{background:var(--ac)}
.log{border-left:2px solid var(--bd);padding-left:10px;margin:8px 0 0 4px}.log div{margin-bottom:6px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9;max-width:90%}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.who{display:grid;gap:8px}.who button{text-align:left;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.who button:hover{border-color:var(--ac)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="app"><p style="padding:20px;font-size:16px">Loading the HOA portal demo. If this message stays on screen, your viewer is blocking scripts. Open this file in Safari or Chrome instead, or use the online link.</p></div>
<script>
const WF={inquiry:["New","In review","Answered","Closed"],complaint:["Received","Investigating","Notice sent","Resolved"],acc:["Submitted","Under review","Decision"]};
const TN={inquiry:"Inquiry",complaint:"Complaint",acc:"ACC request"};
const d0=()=>new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
const S={user:null,view:"dash",tab:"in",open:null,
users:[{id:"m1",name:"Maria Lopez",email:"maria@example.com",role:"member",unit:"12 Oak Ln"},{id:"m2",name:"James Chen",email:"james@example.com",role:"member",unit:"27 Cedar Ct"},{id:"d1",name:"Priya Nair",email:"priya@example.com",role:"director",unit:"4 Birch Way",title:"Board President"},{id:"a1",name:"Sam Rivera",email:"sam@example.com",role:"admin",unit:"Management office",title:"Property manager"}],
charges:[{id:1,uid:"m1",desc:"Q4 2026 assessment",amt:450,type:"due",paid:false},{id:2,uid:"m1",desc:"Trash bin left out (Oct 28)",amt:50,type:"fine",paid:false},{id:3,uid:"m2",desc:"Q4 2026 assessment",amt:450,type:"due",paid:false},{id:4,uid:"m2",desc:"Q3 2026 assessment",amt:450,type:"due",paid:true}],
reqs:[{id:1,uid:"m1",type:"acc",title:"Replace front fence with cedar",body:"Replace 40 ft of white vinyl fence with 5 ft cedar privacy fence.",status:"Under review",log:[["Oct 30","Submitted by Maria Lopez"],["Nov 2","Moved to Under review: Priya Nair"]]},{id:2,uid:"m2",type:"complaint",title:"Barking dog, Unit 31",body:"Dog barks most nights after 10 pm.",status:"Received",log:[["Nov 4","Submitted by James Chen"]]}],
invites:[{code:"OAK-7421",email:"",status:"Open"}],sent:[],
docs:[{id:1,title:"CC&Rs and Bylaws",cat:"Governing",group:"owners",date:"Jan 5"},{id:2,title:"2026 Approved Budget",cat:"Financial",group:"owners",date:"Dec 12"},{id:3,title:"Annual Meeting Minutes 2025",cat:"Minutes",group:"owners",date:"Nov 20"},{id:4,title:"Board Meeting Minutes, Oct 2026",cat:"Minutes",group:"board",date:"Oct 28"},{id:5,title:"Reserve Study (draft)",cat:"Financial",group:"board",date:"Oct 15"},{id:6,title:"Vendor Contracts 2027",cat:"Contracts",group:"board",date:"Sep 30"},{id:7,title:"Delinquency and Collections Report",cat:"Financial",group:"admin",date:"Nov 1"}]};
const $=s=>document.getElementById(s);
S.docs.forEach(d=>{d.ver=[{v:1,date:d.date,note:"Initial upload",by:"Sam Rivera"}];d.ack={};d.needAck=d.id<=2;if(d.id===1)d.ack={m2:{v:1,date:"Nov 3"}};if(d.id===2)d.ver.unshift({v:2,date:"Jan 9",note:"Corrected utilities line item",by:"Priya Nair"})});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"$"+n.toFixed(2);
const staff=()=>S.user&&S.user.role!=="member";
const uname=id=>(S.users.find(u=>u.id===id)||{}).name||"";
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function go(v,o){S.view=v;S.open=o||null;render()}
function nav(){const r=[["dash","Home"],["pay","Pay"],["req","Requests"],["new","New request"],["docs","Documents"]];
 if(staff())r.push(["invite","Invites"],["bcast","Broadcast"],["mem","Members"]);
 if(S.user.role==="admin")r.push(["ledger","Charges"]);return r}
function render(){$("app").innerHTML=S.user?shell():auth();tot();window.scrollTo(0,0)}
function shell(){const u=S.user;
 return `<header><b>Maple Ridge HOA</b><span class="tag">${u.role}</span><button class="s" onclick="S.user=null;render()">Sign out</button></header>
 <nav>${nav().map(([k,l])=>`<button class="${S.view===k||(S.view==="detail"&&k==="req")||(S.view==="docdetail"&&k==="docs")?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}</nav>
 <main>${views[S.view]()}</main>`}
function auth(){return `<main><div class="card"><h2>Maple Ridge HOA portal</h2><p class="mut">Demo with sample data. Nothing is sent or charged.</p>
<div class="tabs"><button class="${S.tab==="in"?"p":"s"}" onclick="S.tab='in';render()">Sign in</button><button class="${S.tab==="reg"?"p":"s"}" onclick="S.tab='reg';render()">Register</button></div>
${S.tab==="in"?`<p class="mut">Pick a demo account. Each role sees different tools.</p><div class="who">${S.users.map(u=>`<button onclick="login('${u.id}')"><b>${u.name}</b> <span class="tag">${u.role}</span><br><span class="mut">${u.title||u.unit}</span></button>`).join("")}</div>`
:`<p class="mut">Use the code or the email address from your invitation. Demo code: <b>OAK-7421</b></p>
<label>Registration code or invited email</label><input id="rc" placeholder="OAK-7421 or you@example.com">
<label>Full name</label><input id="rn"><label>Email address (required)</label><input id="re" type="email" placeholder="you@example.com"><div class="mut">We email request updates, ACC decisions, payment receipts and board announcements here.</div><label>Unit address</label><input id="ru"><label>Create password</label><input type="password" id="rp" placeholder="Not stored in the demo">
<p><button class="p" onclick="register()">Create account</button></p>`}</div></main>`}
function login(id){S.user=S.users.find(u=>u.id===id);S.view="dash";render()}
function register(){const c=$("rc").value.trim(),n=$("rn").value.trim(),un=$("ru").value.trim(),em=$("re").value.trim();
 const inv=S.invites.find(i=>i.status!=="Used"&&(i.code.toLowerCase()===c.toLowerCase()||(i.email&&i.email.toLowerCase()===c.toLowerCase())));
 if(!inv)return toast("Code or email not recognized. Ask a director for a new invite.");
 if(!n||!un)return toast("Enter your name and unit address.");
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast("Enter a valid email address. It’s where we send updates and decisions.");
 if(S.users.some(u=>u.email.toLowerCase()===em.toLowerCase()))return toast("That email is already registered. Sign in instead.");
 inv.status="Used";const u={id:"m"+(S.users.length+1),name:n,email:em,role:"member",unit:un};S.users.push(u);S.user=u;S.view="dash";render();toast("Welcome, "+n+". Confirmation sent to "+em+" (simulated).")}
const myCh=()=>S.charges.filter(c=>c.uid===S.user.id&&!c.paid);
const myReqs=()=>S.reqs.filter(r=>staff()||r.uid===S.user.id);
function badge(r){const s=r.status;return `<span class="tag ${/Approved|Resolved|Closed/.test(s)?"ok":/Denied/.test(s)?"er":/Info|Notice/.test(s)?"wa":""}">${s}</span>`}
function reqList(a){return a.length?a.map(r=>`<div class="item row" style="cursor:pointer" onclick="go('detail',${r.id})"><div><b>${esc(r.title)}</b><div class="mut">${TN[r.type]}${staff()?" · "+uname(r.uid):""}</div></div>${badge(r)}</div>`).join(""):`<p class="mut">No requests yet. Use New request to start one.</p>`}
const views={
dash(){const u=S.user,due=myCh().reduce((a,c)=>a+c.amt,0),op=myReqs().filter(r=>!/Closed|Resolved|Approved|Denied/.test(r.status)).length;
 return `<h2>Hello, ${u.name.split(" ")[0]}</h2><div class="grid"><div class="card"><div class="mut">Balance due</div><div class="big">${money(due)}</div><button class="p" onclick="go('pay')">Pay now</button></div>
 <div class="card"><div class="mut">${staff()?"Open requests (all members)":"Your open requests"}</div><div class="big">${op}</div><button class="s" onclick="go('req')">View requests</button></div></div>
 ${pend()}<div class="card"><h3>Announcements</h3>${(S.sent.length?S.sent:[{subj:"Winter pool closure",body:"The pool closes Nov 15 and reopens in April.",when:"Nov 1"}]).slice(0,3).map(m=>`<div class="item"><b>${esc(m.subj)}</b> <span class="mut">${m.when}</span><div>${esc(m.body)}</div></div>`).join("")}</div>`},
pay(){const l=myCh();window.sel=new Set(l.map(c=>c.id));
 return `<h2>Pay dues and fines</h2><div class="card">${l.length?l.map(c=>`<label class="row" style="margin:0;padding:8px 0;color:var(--tx);font-size:15px"><span><input type="checkbox" checked style="width:auto" onchange="this.checked?sel.add(${c.id}):sel.delete(${c.id});tot()"> ${esc(c.desc)} <span class="tag ${c.type==="fine"?"er":""}">${c.type}</span></span><b>${money(c.amt)}</b></label>`).join("")+`<label>Pay from</label><select id="pm"><option>Bank account (ACH) ending 4821, no fee</option><option>Card ending 1190, 2.9% fee</option></select><p class="row"><b>Total: <span id="tt"></span></b><button class="p" onclick="pay()">Pay HOA</button></p><p class="mut">Funds go to the HOA operating account ending 9021 (simulated).</p>`:`<p>You’re all paid up. Thank you.</p>`}</div>
 <div class="card"><h3>Payment history</h3>${S.charges.filter(c=>c.uid===S.user.id&&c.paid).map(c=>`<div class="item row"><span>${esc(c.desc)}</span><span class="tag ok">Paid ${money(c.amt)}</span></div>`).join("")||`<p class="mut">No payments yet.</p>`}</div>`},
req(){return `<h2>${staff()?"Request queue":"My requests"}</h2><div class="card">${reqList(myReqs())}</div>`},
new(){return `<h2>New request</h2><div class="card"><label>Type</label><select id="nt"><option value="inquiry">Inquiry (question for the board)</option><option value="complaint">Complaint (neighbor or common area)</option><option value="acc">ACC request (architectural change)</option></select>
 <label>Title</label><input id="ntl"><label>Details</label><textarea id="nb"></textarea><p class="mut">Inquiries get a reply. Complaints are investigated. ACC requests are reviewed, then approved or denied.</p><button class="p" onclick="submitReq()">Submit request</button></div>`},
detail(){const r=S.reqs.find(x=>x.id===S.open),st=WF[r.type],i=r.type==="acc"?(/Approved|Denied/.test(r.status)?2:r.status==="Submitted"?0:1):st.indexOf(r.status);
 return `<p><button class="s" onclick="go('req')">Back</button></p><div class="card"><div class="row"><h2 style="margin:0">${esc(r.title)}</h2>${badge(r)}</div><div class="mut">${TN[r.type]} from ${uname(r.uid)}</div><div class="steps">${st.map((s,k)=>`<i class="${k<=i?"d":""}" title="${s}"></i>`).join("")}</div><div class="mut">${st.join(" → ")}</div><p>${esc(r.body)}</p>
 <h3>History</h3><div class="log">${r.log.map(l=>`<div><b>${l[0]}</b> ${esc(l[1])}</div>`).join("")}</div>${acts(r)}</div>`},
docs(){const u=S.user,can=d=>d.group==="owners"||(d.group==="board"&&staff())||(d.group==="admin"&&u.role==="admin"),L={owners:"All owners",board:"Board only",admin:"Management only"},list=S.docs.filter(can);
 return `<h2>Documents</h2><div class="card"><div class="mut">Signed in as ${u.role}. ${list.length} document${list.length===1?"":"s"} available to your access group.</div>${list.map(d=>`<div class="item row"><div><b>${esc(d.title)}</b><div class="mut">${d.cat} · ${d.date} · v${d.ver[0].v}</div></div><div><span class="tag ${d.group==="owners"?"":"wa"}">${L[d.group]}</span> ${ackTag(d)} <button class="s" onclick="go('docdetail',${d.id})">Details</button></div></div>`).join("")}</div>`+(staff()?`<div class="card"><h3>Add a document</h3><label>Title</label><input id="dt"><label>Category</label><select id="dc"><option>Governing</option><option>Financial</option><option>Minutes</option><option>Contracts</option><option>Forms</option></select><label>Requires owner acknowledgement</label><select id="dk"><option value="0">No</option><option value="1">Yes</option></select><label>Who can see it</label><select id="dg"><option value="owners">All owners</option><option value="board">Board only</option>${u.role==="admin"?`<option value="admin">Management only</option>`:""}</select><p><button class="p" onclick="addDoc()">Add document (simulated upload)</button></p></div>`:"")},
docdetail(){const d=S.docs.find(x=>x.id===S.open),u=S.user,c=d.ver[0].v,mem=S.users.filter(x=>x.role==="member");let a="";
 if(d.needAck){if(staff())a=`<h3>Owner acknowledgements for v${c}</h3>${mem.map(m=>`<div class="item row"><span>${m.name}</span><span class="tag ${ok(d,m.id)?"ok":"wa"}">${ok(d,m.id)?"Acknowledged "+d.ack[m.id].date:"Pending"}</span></div>`).join("")}<p><button class="s" onclick="remind(${d.id})">Email reminder to pending owners</button></p>`;
 else a=ok(d,u.id)?`<p><span class="tag ok">You acknowledged v${c} on ${d.ack[u.id].date}</span></p>`:`<p>${d.ack[u.id]?"A new version was posted. Please review it and acknowledge again.":"Please read this document and confirm you received it."}</p><button class="p" onclick="ackDoc(${d.id})">I acknowledge v${c}</button>`}
 return `<p><button class="s" onclick="go('docs')">Back</button></p><div class="card"><div class="row"><h2 style="margin:0">${esc(d.title)}</h2><span class="tag">v${c}</span></div><div class="mut">${d.cat} · Updated ${d.ver[0].date}</div><p><button class="p" onclick="openDoc(${d.id})">Open current version</button></p>${a}</div><div class="card"><h3>Version history</h3>${d.ver.map(v=>`<div class="item"><b>v${v.v}</b> <span class="mut">${v.date} · ${esc(v.by)}</span><div>${esc(v.note)}</div></div>`).join("")}${staff()?`<label>What changed?</label><input id="vn"><p><button class="s" onclick="upVer(${d.id})">Upload new version (simulated)</button></p>`:""}</div>`},
invite(){return `<h2>Invite members</h2><div class="card"><h3>Invite by email</h3><input id="ie" type="email" placeholder="neighbor@example.com"><p><button class="p" onclick="inv(1)">Send invite email</button></p>
 <h3>Or create a registration code</h3><p><button class="s" onclick="inv(0)">Generate code</button></p></div>
 <div class="card"><h3>Invitations</h3>${S.invites.map(i=>`<div class="item row"><span><b>${i.code}</b> <span class="mut">${esc(i.email||"code only")}</span></span><span class="tag ${i.status==="Used"?"ok":"wa"}">${i.status}</span></div>`).join("")}</div>`},
bcast(){return `<h2>Broadcast email</h2><div class="card"><label>Send to</label><select id="ba"><option>All members</option><option>Members with a balance due</option><option>Directors only</option></select><label>Subject</label><input id="bs"><label>Message</label><textarea id="bm"></textarea><p><button class="p" onclick="bc()">Send to members</button></p></div>
 <div class="card"><h3>Sent</h3>${S.sent.map(m=>`<div class="item"><b>${esc(m.subj)}</b> <span class="mut">${m.when} to ${m.aud} (${m.n})</span></div>`).join("")||`<p class="mut">Nothing sent yet.</p>`}</div>`},
mem(){return `<h2>Members</h2><div class="card scroll">${S.users.map(u=>`<div class="item row"><div><b>${u.name}</b><div class="mut">${u.unit} · ${u.email}</div></div><div>${S.user.role==="admin"&&u.id!==S.user.id?`<select onchange="role('${u.id}',this.value)">${["member","director","admin"].map(r=>`<option ${r===u.role?"selected":""}>${r}</option>`).join("")}</select>`:`<span class="tag">${u.role}</span>`}</div></div>`).join("")}</div>`},
ledger(){return `<h2>Charges and fines</h2><div class="card"><label>Member</label><select id="lu">${S.users.filter(u=>u.role==="member").map(u=>`<option value="${u.id}">${u.name}</option>`).join("")}</select><label>Type</label><select id="lt"><option value="fine">Fine</option><option value="due">Due</option></select><label>Description</label><input id="ld"><label>Amount ($)</label><input id="la" type="number" min="0"><p><button class="p" onclick="addCh()">Add charge</button></p></div>
 <div class="card"><h3>All charges</h3>${S.charges.map(c=>`<div class="item row"><span>${uname(c.uid)}: ${esc(c.desc)}</span><span class="tag ${c.paid?"ok":"wa"}">${money(c.amt)} ${c.paid?"paid":"due"}</span></div>`).join("")}</div>`}};
function tot(){const e=$("tt");if(e)e.textContent=money(S.charges.filter(c=>sel.has(c.id)).reduce((a,c)=>a+c.amt,0))}
function pay(){const ids=[...sel];if(!ids.length)return toast("Select at least one charge.");S.charges.forEach(c=>{if(ids.includes(c.id))c.paid=true});render();toast("Payment received. Receipt emailed (simulated).")}
function submitReq(){const t=$("ntl").value.trim(),b=$("nb").value.trim(),ty=$("nt").value;if(!t||!b)return toast("Add a title and details.");
 S.reqs.push({id:S.reqs.length+1,uid:S.user.id,type:ty,title:t,body:b,status:WF[ty][0],log:[[d0(),"Submitted by "+S.user.name]]});go("req");toast(TN[ty]+" submitted. Confirmation emailed to "+S.user.email+" (simulated).")}
function nextOf(r){const s=r.status;const m={inquiry:{New:["In review"],"In review":["Answered"],Answered:["Closed"]},complaint:{Received:["Investigating"],Investigating:["Notice sent","Resolved"],"Notice sent":["Resolved"]},acc:{Submitted:["Under review"],"Under review":["Approved","Denied","Info requested"]}};return (m[r.type]||{})[s]||[]}
function acts(r){let h="";
 if(staff()){const n=nextOf(r);if(n.length)h=`<label>Note to member (optional)</label><input id="an"><p class="row" style="justify-content:flex-start">${n.map(s=>`<button class="${/Denied/.test(s)?"s":"p"}" onclick="adv(${r.id},'${s}')">${/Approved|Denied|Info/.test(s)?s:"Move to "+s}</button>`).join("")}</p>`;}
 else if(r.status==="Info requested")h=`<label>Your reply</label><input id="an"><p><button class="p" onclick="adv(${r.id},'Under review')">Resubmit with info</button></p>`;
 else if(r.type==="inquiry"&&r.status==="Answered")h=`<p><button class="p" onclick="adv(${r.id},'Closed')">Mark as resolved</button></p>`;
 return h}
function adv(id,s){const r=S.reqs.find(x=>x.id===id),n=$("an")?$("an").value.trim():"";r.status=s;r.log.push([d0(),`${s} by ${S.user.name}${n?": "+n:""}`]);render();toast("Status updated. Email sent to "+S.users.find(u=>u.id===r.uid).email+" (simulated).")}
function inv(byEmail){const e=byEmail?$("ie").value.trim():"";if(byEmail&&!/.+@.+\..+/.test(e))return toast("Enter a valid email address.");
 const code=["OAK","ELM","PINE"][S.invites.length%3]+"-"+(1000+Math.floor(Math.random()*8999));S.invites.unshift({code,email:e,status:e?"Emailed":"Open"});render();toast(e?"Invite emailed to "+e+" (simulated).":"Code "+code+" created.")}
function bc(){const s=$("bs").value.trim(),m=$("bm").value.trim(),a=$("ba").value;if(!s||!m)return toast("Add a subject and message.");
 const n=a==="Directors only"?S.users.filter(u=>u.role==="director").length:a.startsWith("Members with")?new Set(S.charges.filter(c=>!c.paid).map(c=>c.uid)).size:S.users.filter(u=>u.role==="member").length;
 S.sent.unshift({subj:s,body:m,aud:a.toLowerCase(),n,when:d0()});render();toast("Sent to "+n+" recipient"+(n===1?"":"s")+" (simulated).")}
const ok=(d,id)=>d.ack[id]&&d.ack[id].v===d.ver[0].v;
function ackTag(d){if(!d.needAck)return "";if(staff()){const m=S.users.filter(x=>x.role==="member");return `<span class="tag">${m.filter(x=>ok(d,x.id)).length} of ${m.length} acknowledged</span>`}return ok(d,S.user.id)?`<span class="tag ok">Acknowledged</span>`:`<span class="tag er">Action needed</span>`}
function pend(){if(staff())return "";const n=S.docs.filter(d=>d.needAck&&d.group==="owners"&&!ok(d,S.user.id)).length;return n?`<div class="card row"><b>${n} document${n>1?"s":""} need${n>1?"":"s"} your acknowledgement</b><button class="s" onclick="go('docs')">Review</button></div>`:""}
function ackDoc(id){const d=S.docs.find(x=>x.id===id);d.ack[S.user.id]={v:d.ver[0].v,date:d0()};render();toast("Acknowledgement recorded. Receipt emailed to "+S.user.email+" (simulated).")}
function upVer(id){const d=S.docs.find(x=>x.id===id),n=$("vn").value.trim();if(!n)return toast("Describe what changed.");d.ver.unshift({v:d.ver[0].v+1,date:d0(),note:n,by:S.user.name});d.date=d0();render();toast("Version "+d.ver[0].v+" posted."+(d.needAck?" Owners must acknowledge again.":""))}
function remind(id){const d=S.docs.find(x=>x.id===id),n=S.users.filter(x=>x.role==="member"&&!ok(d,x.id)).length;toast(n?"Reminder emailed to "+n+" owner"+(n>1?"s":"")+" (simulated).":"Everyone has acknowledged.")}
function openDoc(id){toast("Opening “"+S.docs.find(x=>x.id===id).title+"” (demo: no real file attached)")}
function addDoc(){const t=$("dt").value.trim();if(!t)return toast("Enter a document title.");S.docs.unshift({id:S.docs.length+1,title:t,cat:$("dc").value,group:$("dg").value,date:d0(),needAck:$("dk").value==="1",ack:{},ver:[{v:1,date:d0(),note:"Initial upload",by:S.user.name}]});render();toast("Document added. Visible to "+({owners:"all owners",board:"the board only",admin:"management only"})[S.docs[0].group]+".")}
function role(id,r){S.users.find(u=>u.id===id).role=r;toast("Role changed to "+r+". Access updates at next sign-in.")}
function addCh(){const d=$("ld").value.trim(),a=parseFloat($("la").value);if(!d||!(a>0))return toast("Add a description and amount.");
 S.charges.push({id:S.charges.length+1,uid:$("lu").value,desc:d,amt:a,type:$("lt").value,paid:false});render();toast("Charge added. Member notified (simulated).")}
render();
</script>
